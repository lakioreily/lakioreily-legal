<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>StanKlik - Uspešna Prijava</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #007AFF; }
        p { font-size: 16px; line-height: 1.5; color: #cccccc; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Uspješna potvrda!</h2>
        <p>Vaša email adresa je uspešno potvrđena. Možete zatvoriti ovaj prozor i vratiti se u aplikaciju <b>StanKlik</b> kako biste se prijavili.</p>
        <hr style="border-color: #333; margin: 20px 0;">
        <p>Your email address has been successfully verified. You can close this window and return to the <b>StanKlik</b> app to log in.</p>
    </div>
</body>
</html>
